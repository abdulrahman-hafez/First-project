<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Expense Tracker</span>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Alert Message -->
        <div id="alertMessage"></div>

        <!-- Add Expense Form -->
        <form id="expenseForm" class="mb-4">
            <div class="row">

                <div class="col-md-3 mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input
                        type="text"
                        id="title"
                        class="form-control"
                        required
                    >
                </div>

                <div class="col-md-2 mb-3">
                    <label for="amount" class="form-label">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="col-md-3 mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" class="form-select" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="col-md-2 mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input
                        type="date"
                        id="date"
                        class="form-control"
                        required
                    >
                </div>

                <div class="col-md-2 mb-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        Add Expense
                    </button>
                </div>

            </div>
        </form>

        <!-- Summary Cards -->
        <div class="summary-cards mb-4">

            <div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Total Expenses</h5>
                        <p id="totalExpenses" class="card-text fs-3">0</p>
                    </div>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Total Amount</h5>
                        <p id="totalAmount" class="card-text fs-3">0.00</p>
                    </div>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Highest Expense</h5>
                        <p id="highestExpense" class="card-text fs-3">0.00</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Category Filter -->
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="categoryFilter" class="form-label">
                    Filter by Category
                </label>

                <select id="categoryFilter" class="form-select">
                    <option value="All">All</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <!-- Expenses Table -->
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="expenseTableBody">
                    <tr>
                        <td colspan="6" class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">
                                    Loading...
                                </span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Edit Expense Modal -->
    <div
        class="modal fade"
        id="editExpenseModal"
        tabindex="-1"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Edit Expense</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>

                <div class="modal-body">
                    <form id="editExpenseForm">

                        <input type="hidden" id="editId">

                        <div class="mb-3">
                            <label for="editTitle" class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                id="editTitle"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="editAmount" class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                id="editAmount"
                                class="form-control"
                                step="0.01"
                                min="0"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="editCategory" class="form-label">
                                Category
                            </label>

                            <select
                                id="editCategory"
                                class="form-select"
                                required
                            >
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editDate" class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                id="editDate"
                                class="form-control"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
